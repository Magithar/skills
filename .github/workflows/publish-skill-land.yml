name: publish-skill-land

# Trusted publishing via OIDC. No NPM_TOKEN, no long-lived credential, and the
# account keeps 2FA on write actions. npm mints a short-lived token from the
# GitHub identity of this exact workflow file, so the filename here must match
# the Trusted Publisher config on npmjs.com character for character.
#
# Release: git tag skill-land-v1.0.2 && git push origin skill-land-v1.0.2
# The tag is package-scoped so other tools in this repo can release separately.

on:
  push:
    tags:
      - "skill-land-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/skill-land
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; the bundled npm may be older.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      - name: Test
        run: node test.mjs

      # Refuse to publish a version that already exists, with a clearer message
      # than npm's 403. Catches a tag pushed without bumping package.json.
      - name: Check version is unpublished
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "$NAME@$VERSION"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. Bump the version in package.json."
            exit 1
          fi

      # Tag must match the version being published, or a mistyped tag ships the
      # wrong thing silently.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF#refs/tags/skill-land-v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag skill-land-v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Publish
        run: npm publish

      # A tag is only a pointer. Without this the repo front page shows no
      # releases at all, which is how skill-land-v1.1.0 shipped with nothing
      # to point people at.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## +"v"( |$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md 2>/dev/null)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/tools/skill-land/CHANGELOG.md)."
          fi
          printf '%s\n\n---\n\n`npx skill-land@%s`  ·  [npm](https://www.npmjs.com/package/skill-land/v/%s)\n' \
            "$NOTES" "$VERSION" "$VERSION" > /tmp/notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "skill-land v$VERSION" \
            --notes-file /tmp/notes.md
