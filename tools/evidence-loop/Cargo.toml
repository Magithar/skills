[package]
name = "evidence-loop"
version = "0.1.0"
edition = "2021"
description = "Deterministic evidence bookkeeping and closure enforcement for AI agents."
license = "MIT"
repository = "https://github.com/Magithar/skills"
homepage = "https://github.com/Magithar/skills/tree/main/tools/evidence-loop"
readme = "README.md"
keywords = ["cli", "agent", "evidence", "hypothesis", "protocol"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "evidence-loop"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
